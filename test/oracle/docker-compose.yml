version: '3.8'

services:
  oracle-xe:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-xe-dev
    ports:
      - "1521:1521"  # Oracle listener
      - "5500:5500"  # Oracle Enterprise Manager Express
    environment:
      # Set the SYS, SYSTEM and PDBADMIN password
      ORACLE_PWD: DevPassword123
      # Optional: Enable archive log mode (default is false)
      # ENABLE_ARCHIVELOG: "true"
    volumes:
      # Persist Oracle data
      - oracle-data:/opt/oracle/oradata
      # Optional: Place init scripts here (will run on first startup)
      # - ./init-scripts:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/DevPassword123@localhost:1521/XE"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    shm_size: 1gb
    restart: unless-stopped

volumes:
  oracle-data:
    driver: local
